<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rapids</title>
    <meta name="author" content="Diego Francisco De La Cruz Zambrano">
    <meta name="description"
      content="Explore exciting water rafting adventures in Peru with Diego's rafting website for travel, fun, and outdoor experiences.">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rapids.jpeg" alt="river boat">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>

            <div class="contact-container">

                <div class="map">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d51802.35245671003!2d-113.4672854!3d35.7594795!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2spe!4v1781317952669!5m2!1ses!2spe"
                      width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

                <form class="contact-form">

                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">

                    <label for="email">Email</label>
                    <input type="email" id="email" name="name">

                    <label>Message Purpose</label>
                    <div class="radio-group">
                        <input type="radio" id="general" name="purpose">
                        <label for="general">General Inquiry</label>

                        <input type="radio" id="reservation" name="purpose">
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="suggestion" name="purpose">
                        <label for="suggestion">Website Suggestion</label>
                    </div>

                    <label for="message">Message</label>
                    <textarea id="message" name="name"></textarea>

                    <div></div>
                    <label>
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <div></div>
                    <button type="submit">Get in Touch!</button>

                </form>

            </div>
        </section>

        <section class="adv">
            <h2>We are here to serve you</h2>
            <div class="adventure">
                <figure>
                    <img src="images/employe1.jpg" alt="employee image">
                    <figcaption>Nimrod Rodriguez</figcaption>
                </figure>
                <figure>
                    <img src="images/employe2.jpg" alt="employee image">
                    <figcaption>Sebastian Mendez</figcaption>
                </figure>
                <figure>
                    <img src="images/empploye3.jpg" alt="employee image">
                    <figcaption>Luz Enriquez</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>©2026 | Rapids | Diego De La Cruz</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/francisco.de.la.cruz.zambrano">
                <img src="images/facebook-icon.png" alt="Facebook profile">
            </a>
            <a href="https://www.instagram.com/delacruzito147/">
                <img src="images/instagram-icon.webp" alt="Instagram profile">
            </a>
            <a href="https://www.linkedin.com/feed/">
                <img src="images/in-icon.png" alt="Linkedin profile">
            </a>
        </nav>
    </footer>
</body>

</html>
